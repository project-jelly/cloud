name: "[release][core-request][gh-multi] Build & Publish"

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Annotated release tag on cloud-core (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_sha:
        description: Full 40-character source commit SHA identified by the core tag
        required: true
        type: string
      source_ci_run_id:
        description: Successful core main push CI run for this source commit
        required: true
        type: string
      publish:
        description: Build, scan, and publish this release (false only checks the plan)
        required: true
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: cagojeiger
  IMAGE: project-jelly/cloud

jobs:
  version:
    environment: core-read
    name: Validate source and release plan
    if: github.repository_id == '1452070902' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      control_sha: ${{ steps.control.outputs.commit }}
      ci_run_id: ${{ steps.plan.outputs.ci_run_id }}
      tag_object_sha: ${{ steps.plan.outputs.tag_object_sha }}
      notes_sha256: ${{ steps.plan.outputs.notes_sha256 }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: project-jelly
          repositories: cloud-core
          skip-token-revoke: true
          permission-contents: read
          permission-actions: read

      - name: Checkout trusted private Release control
        id: control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-jelly/cloud-core
          ref: main
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: |
            .github
            deploy/ci
          persist-credentials: false

      - name: Check exact source, CI, and release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: python3 "$GITHUB_WORKSPACE/.control/.github/scripts/release_gate.py" >> "$GITHUB_OUTPUT"

      - name: Verify private image destination
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: python3 "$GITHUB_WORKSPACE/.control/.github/scripts/private_image_guard.py"

      - name: Revoke Release control token
        id: revoke-metadata-token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Ensure core metadata token revoked
        if: ${{ always() && steps.core-token.outputs.token != '' && steps.revoke-metadata-token.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$CORE_TOKEN" | \
            curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --request DELETE --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --config - \
              https://api.github.com/installation/token)
          test "$status" = 204

  build:
    environment: core-read
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: project-jelly
          repositories: cloud-core
          skip-token-revoke: true
          permission-contents: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-jelly/cloud-core
          ref: ${{ needs.version.outputs.control_sha }}
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: |
            .github
            deploy/ci
          persist-credentials: false

      - name: Revoke Release control token
        id: revoke-metadata-token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Ensure core metadata token revoked
        if: ${{ always() && steps.core-token.outputs.token != '' && steps.revoke-metadata-token.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$CORE_TOKEN" | \
            curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --request DELETE --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --config - \
              https://api.github.com/installation/token)
          test "$status" = 204

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.version.outputs.source_sha }}
          path: source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push by digest
        id: build
        working-directory: source
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.version.outputs.tag }}
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_release_build_image.sh"

      - name: Write the verified platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p /tmp/digests
          printf '%s\n' "$DIGEST" > "/tmp/digests/$ARCH"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  scan:
    environment: core-read
    name: Trivy image gate linux/${{ matrix.arch }}
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: project-jelly
          repositories: cloud-core
          skip-token-revoke: true
          permission-contents: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-jelly/cloud-core
          ref: ${{ needs.version.outputs.control_sha }}
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: |
            .github
            deploy/ci
          persist-credentials: false

      - name: Revoke Release control token
        id: revoke-metadata-token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Ensure core metadata token revoked
        if: ${{ always() && steps.core-token.outputs.token != '' && steps.revoke-metadata-token.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$CORE_TOKEN" | \
            curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --request DELETE --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --config - \
              https://api.github.com/installation/token)
          test "$status" = 204

      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests

      - name: Log in to private GHCR for image scanning
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Checkout exact core source and revoke its token
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.version.outputs.source_sha }}

      - name: Install verified Trivy
        run: bash .control/deploy/ci/install-trivy.sh

      - name: Scan immutable image and source dependencies
        working-directory: source
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          digest=$(cat "/tmp/digests/$ARCH")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash "$GITHUB_WORKSPACE/.control/deploy/ci/scan-release.sh" \
            "ghcr.io/project-jelly/cloud@$digest" "$GITHUB_WORKSPACE/reports/$ARCH" "linux/$ARCH"

      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-trivy-${{ matrix.arch }}
          path: reports/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    environment: core-read
    name: Publish verified release
    needs: [version, build, scan]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: project-jelly
          repositories: cloud-core
          skip-token-revoke: true
          permission-contents: read
          permission-actions: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-jelly/cloud-core
          ref: ${{ needs.version.outputs.control_sha }}
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: |
            .github
            deploy/ci
          persist-credentials: false

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: /tmp/release-inputs/digests
      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: /tmp/release-inputs/digests
      - name: Download amd64 scan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-trivy-amd64
          path: /tmp/release-inputs/scans/amd64
      - name: Download arm64 scan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-trivy-arm64
          path: /tmp/release-inputs/scans/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Validate, stage, verify, and publish approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
          SOURCE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ needs.version.outputs.ci_run_id }}
          SOURCE_TAG_OBJECT_SHA: ${{ needs.version.outputs.tag_object_sha }}
          RELEASE_NOTES_SHA256: ${{ needs.version.outputs.notes_sha256 }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: "true"
        run: |
          AMD64_DIGEST="$(cat /tmp/release-inputs/digests/amd64)"
          ARM64_DIGEST="$(cat /tmp/release-inputs/digests/arm64)"
          export AMD64_DIGEST ARM64_DIGEST
          python3 "$GITHUB_WORKSPACE/.control/.github/scripts/publish_release.py"

      - name: Revoke Release control token
        id: revoke-metadata-token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Ensure core metadata token revoked
        if: ${{ always() && steps.core-token.outputs.token != '' && steps.revoke-metadata-token.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$CORE_TOKEN" | \
            curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --request DELETE --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --config - \
              https://api.github.com/installation/token)
          test "$status" = 204
