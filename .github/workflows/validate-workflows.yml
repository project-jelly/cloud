name: '[ci][pr·main][gh-linux] Workflow Validation'

on:
  pull_request:
    paths: [.github/**]
  push:
    branches: [main]
    paths: [.github/**]

permissions:
  contents: read

jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout public workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: '-ignore ubuntu-26[.]04.*unknown'
